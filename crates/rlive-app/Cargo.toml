[package]
name = "rlive-app"
description = "rLive: a session-oriented DAW inspired by Ableton Live and Bitwig"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "rlive"

[[bin]]
name = "rlive"
path = "src/main.rs"

[dependencies]
rlive-core.workspace = true
rlive-engine.workspace = true
rlive-devices.workspace = true
rlive-project.workspace = true
rlive-plugin-host.workspace = true
rlive-audio-io.workspace = true
rlive-remote.workspace = true
rlive-browser.workspace = true
egui = "0.37"
cpal = "0.18"
midir = "0.11"
rfd = "0.18"
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
rtrb.workspace = true

# Ableton Link. Off by default: the SDK is GPL-2.0-or-later, so a build with this feature on is
# a GPL build. The default build does not compile or link any of it.
[features]
link = ["dep:rusty_link"]

[dependencies.rusty_link]
version = "0.4.9"
optional = true

[dev-dependencies]
ron.workspace = true
rlive-testkit.workspace = true
hound.workspace = true

# macOS renders with Metal. Plugin editors commonly make their own OpenGL
# context current on the main thread, which corrupts eframe's OpenGL drawing.
[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "clipboard", "wgpu_no_default_features"] }
egui-wgpu = { version = "0.37", default-features = false, features = ["macos-window-resize-jitter-fix"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
raw-window-handle = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "clipboard", "glow", "wayland", "x11"] }
